name: Publish
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/prepare-runner
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify server.json version matches package.json
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          SERVER_VERSION=$(jq -r '.version' server.json)
          SERVER_PKG_VERSION=$(jq -r '.packages[0].version' server.json)
          if [ "$PKG_VERSION" != "$SERVER_VERSION" ] || [ "$PKG_VERSION" != "$SERVER_PKG_VERSION" ]; then
            echo "::error::Version mismatch. package.json=$PKG_VERSION server.json.version=$SERVER_VERSION server.json.packages[0].version=$SERVER_PKG_VERSION"
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm knip
      - run: pnpm audit --prod --audit-level=critical
      - run: pnpm test
      - run: pnpm build

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/prepare-runner
        with:
          node-version: "24"
      - run: pnpm build
      - run: pnpm publish --no-git-checks --provenance --access public

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mcp-publisher
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
      - name: Login to MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP registry
        run: ./mcp-publisher publish

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Extract changelog
        id: changelog
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "changelog_content=" >> $GITHUB_OUTPUT
            exit 0
          fi
          TAG_NAME=${GITHUB_REF/refs\/tags\//}
          TAG_NAME=${TAG_NAME#v}
          READ_SECTION=false
          CHANGELOG=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^#+\ +(.*) ]]; then
              if [[ "${BASH_REMATCH[1]}" == "$TAG_NAME" ]]; then
                READ_SECTION=true
              elif [[ "$READ_SECTION" == true ]]; then
                break
              fi
            elif [[ "$READ_SECTION" == true ]]; then
              CHANGELOG+="$line"$'\n'
            fi
          done < "CHANGELOG.md"
          CHANGELOG=$(echo "$CHANGELOG" | awk '/./ {$1=$1;print}')
          echo "changelog_content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub release
        if: steps.changelog.outputs.changelog_content != ''
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog_content }}
          draft: false
          prerelease: false
